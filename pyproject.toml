[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ntl-baseline"
version = "0.1.0"
description = "Reproducible official TF-IDF baseline for Kaggle Name That LLM"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib==1.4.2",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "threadpoolctl==3.6.0",
]

[project.scripts]
ntl-baseline = "ntl_baseline.cli:main"

[dependency-groups]
dev = [
  "ipykernel==6.29.5",
  "mypy==1.15.0",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "pytest==8.3.5",
  "ruff==0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ntl_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/research", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/ntl_baseline"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
